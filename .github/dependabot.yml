version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 5
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
      interval: "daily"
- package-ecosystem: "bundler"
  directory: "/gen"
  schedule:
    interval: "daily"
- package-ecosystem: docker
  directories:
  - /
  - /gen
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gomod
  directories:
  - /govc
  - /hack/tools
  - /vcsim
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
